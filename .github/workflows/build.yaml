name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: australia-southeast1-docker.pkg.dev
  REPO: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt
  IMAGE: preissuance-ext-authz

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute build metadata
        id: meta
        run: |
          version="$(git describe --tags --always --dirty)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$(echo "$version" | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile binaries
        run: make build VERSION=${{ steps.meta.outputs.version }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO }}/${{ env.IMAGE }}:${{ steps.meta.outputs.docker_tag }}
            ${{ env.REPO }}/${{ env.IMAGE }}:latest
